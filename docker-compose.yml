version: '3.8'

services:
  app:
    container_name: nextjs_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    
    # 👇 UBAH MAPPING PORT
    ports:
      - "7020:7020" # Kiri (Host Laptop) : Kanan (Container)
    
    env_file:
      - .env

    environment:
      # Override Env untuk Docker
      - MONGODB_URI=mongodb://mongo:27017/sekolah_db
      
      # 👇 PENTING: Update URL Auth agar login/logout tidak error
      - NEXTAUTH_URL=http://localhost:7020 

    depends_on:
      - mongo
    volumes:
      - ./public/uploads:/app/public/uploads

  mongo:
    container_name: mongodb_container
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: