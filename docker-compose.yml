services:
  app:
    container_name: nextjs_app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_VERSION=${NEXT_PUBLIC_VERSION}
        - NEXT_PUBLIC_PUSHER_KEY=${NEXT_PUBLIC_PUSHER_KEY}
        - NEXT_PUBLIC_PUSHER_CLUSTER=${NEXT_PUBLIC_PUSHER_CLUSTER}
        - NEXT_PUBLIC_CLOUDINARY_PRESET=${NEXT_PUBLIC_CLOUDINARY_PRESET}
        - NEXT_PUBLIC_CLOUDINARY_API_KEY=${NEXT_PUBLIC_CLOUDINARY_API_KEY}
    restart: always
    
    # Mapping Port Aplikasi (Kiri: Laptop/Host, Kanan: Docker)
    ports:
      - "8020:8020"
    
    # Gunakan .env
    env_file:
      - .env.local

    environment:
      - MONGODB_URI=mongodb://mongo:27017/tugasku
      - REDIS_URL=redis://redis:6379
      - AUTH_TRUST_HOST=true
      - NODE_ENV=production
    depends_on:
      - mongo
      - redis
    volumes:
      - ./public/uploads:/app/public/uploads
    deploy:
      resources:
        limits:
          cpus: "3.0"         # Maksimal 3 dari 4 Core agar sistem host tidak freeze
          memory: 2.5G        # Batas atas RAM Next.js
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    container_name: mongodb_container
    image: mongo:latest
    restart: always
    # Batasi cache WiredTiger agar tidak menghabiskan RAM VM
    command: mongod --wiredTigerCacheSizeGB 1.0
    ports:
      - "27117:27017"
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.8G        # RAM MongoDB dibatasi aman (1GB cache + 800MB overhead/koneksi)
        reservations:
          cpus: "0.25"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo-logger:
    container_name: mongo_logger
    image: docker:cli
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - app
      - mongo
    environment:
      - APP_URL=http://app:8020
    command: >
      sh -c '
      apk add --no-cache curl &&
      docker logs -f mongodb_container | while read line; do 
        curl -s -X POST -H "Content-Type: application/json" -d "{\"action\": \"$$line\", \"tipe\": \"warning\", \"currentUrl\": \"Docker\", \"kategori\": \"Database\"}" $$APP_URL/api/client-log > /dev/null || true
      done
      '
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    container_name: redis_container
    image: redis:8.6.2-alpine
    restart: always
    # Konfigurasi max memory & eviction policy (LRU) agar RAM terkontrol
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 600M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
  redis_data: